name: Deploy to HuggingFace Space

# Pushes this repo to the HuggingFace Docker Space Galym7707/GrowlyAI.
# GitHub runners can reach huggingface.co (the Claude Code cloud env cannot),
# so this is the automated path to deploy.
#
# One-time setup in GitHub -> Settings -> Secrets and variables -> Actions:
#   HF_TOKEN  (required)  a HuggingFace *write* token
#                         https://huggingface.co/settings/tokens
#   HF_ENV    (optional)  full contents of your .env file. If set, every
#                         KEY=VALUE line is registered as a Space Secret.
#
# Run it: Actions tab -> "Deploy to HuggingFace Space" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "run_api.py"
      - "run_bot.py"
      - "run_space.py"
      - "requirements.txt"
      - "Dockerfile"
      - "README.md"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.25"

      - name: Push code to the HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: Galym7707/GrowlyAI
          HF_USERNAME: Galym7707
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          # The Space is a deploy target; force-push main so it mirrors GitHub.
          git push --force hf HEAD:main

      - name: Sync Space secrets from HF_ENV
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: Galym7707/GrowlyAI
          HF_ENV: ${{ secrets.HF_ENV }}
        run: python scripts/hf_deploy_secrets.py

      - name: Summary
        run: |
          echo "Deployed to https://huggingface.co/spaces/Galym7707/GrowlyAI" >> "$GITHUB_STEP_SUMMARY"
